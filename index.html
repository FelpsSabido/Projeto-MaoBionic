
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mão Robótica</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .camera-container {
      width: min(100%, 900px);
      margin: auto;
      position: relative;
    }

    video, canvas {
      width: 100%;
      display: block;
      transform: scaleX(-1);
      border-radius: 12px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      padding: 13px 25px;
      margin: 15px;
      border: none;
      border-radius: 8px;
      background: #00b894;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status, #debug {
      margin: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #debug { color: #b2bec3; }
  </style>
</head>

<body>

  <h1>Mão Robótica</h1>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="connectButton">Conectar Arduino</button>

  <div id="status">Iniciando câmera...</div>
  <div id="debug">Aguardando detecção...</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const statusText = document.getElementById("status");
    const debugText = document.getElementById("debug");
    const connectButton = document.getElementById("connectButton");

    // =====================================
    // CONFIGURAÇÕES
    // =====================================

    const SUAVIZACAO = 0.22;
    const TEMPO_CONFIRMAR = 450;

    // Indicador: proporção da extensão do dedo
    const INDICADOR_ABRIR = 0.90;
    const INDICADOR_FECHAR = 0.78;

    // Polegar: distância da ponta até a base do indicador,
    // dividida pela largura da palma.
    const POLEGAR_ABRIR = 0.55;
    const POLEGAR_FECHAR = 0.35;

    // =====================================
    // ESTADOS INDEPENDENTES
    // =====================================

    const dedos = {
      indicador: {
        estado: null,
        candidato: null,
        inicio: 0,
        valor: null
      },

      polegar: {
        estado: null,
        candidato: null,
        inicio: 0,
        valor: null
      }
    };

    let landmarksSuaves = null;
    let port = null;
    let writer = null;
    let filaEnvio = Promise.resolve();

    // =====================================
    // DISTÂNCIAS
    // =====================================

    function distancia3D(a, b) {
      const dx = (a.x - b.x) * video.videoWidth;
      const dy = (a.y - b.y) * video.videoHeight;
      const dz = (a.z - b.z) * video.videoWidth;

      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function distancia2D(a, b) {
      const dx = (a.x - b.x) * video.videoWidth;
      const dy = (a.y - b.y) * video.videoHeight;

      return Math.sqrt(dx * dx + dy * dy);
    }

    // =====================================
    // SUAVIZAÇÃO DOS LANDMARKS
    // =====================================

    function suavizarLandmarks(novos) {
      if (!landmarksSuaves) {
        landmarksSuaves = novos.map(p => ({
          x: p.x,
          y: p.y,
          z: p.z
        }));

        return landmarksSuaves;
      }

      for (let i = 0; i < novos.length; i++) {
        landmarksSuaves[i].x +=
          (novos[i].x - landmarksSuaves[i].x) * SUAVIZACAO;

        landmarksSuaves[i].y +=
          (novos[i].y - landmarksSuaves[i].y) * SUAVIZACAO;

        landmarksSuaves[i].z +=
          (novos[i].z - landmarksSuaves[i].z) * SUAVIZACAO;
      }

      return landmarksSuaves;
    }

    // =====================================
    // CÁLCULO DO INDICADOR
    // =====================================

    function calcularIndicador(p) {
      const comprimento =
        distancia3D(p[5], p[6]) +
        distancia3D(p[6], p[7]) +
        distancia3D(p[7], p[8]);

      const ponta = distancia3D(p[5], p[8]);

      if (comprimento === 0) return null;

      return ponta / comprimento;
    }

    // =====================================
    // CÁLCULO DO POLEGAR
    // =====================================

    function calcularPolegar(p) {
      // Ponta do polegar até a base do indicador
      const abertura = distancia2D(p[4], p[5]);

      // Largura da palma
      const larguraPalma = distancia2D(p[5], p[17]);

      if (larguraPalma === 0) return null;

      return abertura / larguraPalma;
    }

    // =====================================
    // ENVIO AO ARDUINO
    // =====================================

    function enviarArduino(comando) {
      if (!writer) return;

      filaEnvio = filaEnvio.then(async () => {
        if (!writer) return;

        try {
          await writer.write(
            new TextEncoder().encode(comando)
          );
        } catch (erro) {
          console.error("Erro no envio:", erro);
          statusText.textContent = "Erro na comunicação";
        }
      });
    }

    // =====================================
    // CONTROLE INDEPENDENTE DE CADA DEDO
    // =====================================

    function controlarDedo(
      nome,
      valor,
      limiteAbrir,
      limiteFechar,
      comandoAbrir,
      comandoFechar
    ) {
      const dedo = dedos[nome];
      const agora = performance.now();

      let novoCandidato = null;

      if (dedo.estado === "ABERTO") {
        if (valor <= limiteFechar) {
          novoCandidato = "FECHADO";
        }
      }

      else if (dedo.estado === "FECHADO") {
        if (valor >= limiteAbrir) {
          novoCandidato = "ABERTO";
        }
      }

      else {
        if (valor >= limiteAbrir) {
          novoCandidato = "ABERTO";
        } else if (valor <= limiteFechar) {
          novoCandidato = "FECHADO";
        }
      }

      // Meio-termo: mantém a posição atual.
      if (novoCandidato === null) {
        dedo.candidato = null;
        dedo.inicio = 0;
        return;
      }

      if (novoCandidato !== dedo.candidato) {
        dedo.candidato = novoCandidato;
        dedo.inicio = agora;
        return;
      }

      if (agora - dedo.inicio >= TEMPO_CONFIRMAR) {
        if (dedo.estado !== novoCandidato) {
          dedo.estado = novoCandidato;

          if (novoCandidato === "ABERTO") {
            enviarArduino(comandoAbrir);
          } else {
            enviarArduino(comandoFechar);
          }
        }

        dedo.candidato = null;
        dedo.inicio = 0;
      }
    }

    // =====================================
    // MEDIAPIPE
    // =====================================

    const hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.80,
      minTrackingConfidence: 0.80
    });

    hands.onResults(results => {
      if (!video.videoWidth || !video.videoHeight) return;

      if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
      ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
      ) {
        landmarksSuaves = null;

        statusText.textContent = "Mão não detectada";
        debugText.textContent = "Aguardando mão...";

        return;
      }

      const originais = results.multiHandLandmarks[0];
      const p = suavizarLandmarks(originais);

      drawConnectors(ctx, p, HAND_CONNECTIONS, {
        color: "#00FF00",
        lineWidth: 3
      });

      drawLandmarks(ctx, p, {
        color: "#FFFFFF",
        lineWidth: 1,
        radius: 4
      });

      const indicador = calcularIndicador(p);
      const polegar = calcularPolegar(p);

      if (indicador === null || polegar === null) return;

      dedos.indicador.valor = indicador;
      dedos.polegar.valor = polegar;

      controlarDedo(
        "indicador",
        indicador,
        INDICADOR_ABRIR,
        INDICADOR_FECHAR,
        "1",
        "0"
      );

      controlarDedo(
        "polegar",
        polegar,
        POLEGAR_ABRIR,
        POLEGAR_FECHAR,
        "A",
        "B"
      );

      statusText.textContent =
        `Indicador: ${dedos.indicador.estado || "Aguardando"} | ` +
        `Polegar: ${dedos.polegar.estado || "Aguardando"}`;

      debugText.textContent =
        `Indicador: ${indicador.toFixed(3)} | ` +
        `Polegar: ${polegar.toFixed(3)} | ` +
        `Candidato indicador: ${dedos.indicador.candidato || "Nenhum"} | ` +
        `Candidato polegar: ${dedos.polegar.candidato || "Nenhum"}`;
    });

    // =====================================
    // CÂMERA
    // =====================================

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    camera.start()
      .then(() => {
        statusText.textContent = "Câmera iniciada";
      })
      .catch(erro => {
        console.error(erro);
        statusText.textContent = "Erro ao iniciar câmera";
      });

    // =====================================
    // CONEXÃO SERIAL
    // =====================================

    connectButton.addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        statusText.textContent =
          "Web Serial não disponível. Utilize Chrome.";
        return;
      }

      try {
        port = await navigator.serial.requestPort();

        await port.open({ baudRate: 9600 });

        writer = port.writable.getWriter();

        connectButton.textContent = "Arduino conectado";
        statusText.textContent = "Conectado! Movimente os dedos.";

      } catch (erro) {
        console.error(erro);
        statusText.textContent = "Falha ao conectar Arduino";
      }
    });

  </script>
</body>
</html>
