
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mão Robótica</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .camera-container {
      width: min(100%, 900px);
      margin: auto;
      position: relative;
    }

    video, canvas {
      width: 100%;
      display: block;
      transform: scaleX(-1);
      border-radius: 12px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      padding: 13px 25px;
      margin: 15px;
      border: none;
      border-radius: 8px;
      background: #00b894;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status, #debug {
      margin: 12px auto;
      max-width: 900px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #debug {
      color: #b2bec3;
      text-align: left;
      white-space: pre-line;
      background: #1b2833;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
</head>

<body>

  <h1>Mão Robótica</h1>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="connectButton">Conectar Arduino</button>

  <div id="status">Iniciando câmera...</div>

  <div id="debug">
    Aguardando detecção...
  </div>

  <script src="script.js"></script>

</body>
</html>
